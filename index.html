<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>He's Back!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
      padding: 1rem;
    }
    .container {
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    label {
      font-size: 1.1rem;
      font-weight: bold;
      display: block;
      margin-bottom: 0.5rem;
      text-align: left;
    }
    select {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
      margin-bottom: 1.2rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 0.5rem;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #reset-btn {
      background-color: #6c757d;
      display: none;
    }
    #reset-btn:hover {
      background-color: #5a6268;
    }
    #image-container {
      margin-top: 1.5rem;
    }
    #kermit-img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      display: none;
      margin-top: 1rem;
    }
    #status-text {
      display: none;
      font-weight: bold;
      color: #555;
    }
    #bio-text {
      display: none;
      margin-top: 1rem;
      font-style: italic;
      color: #333;
      background: #f8f9fa;
      padding: 0.8rem;
      border-left: 4px solid #007bff;
      border-radius: 4px;
      text-align: left;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <form id="color-form">
      <!-- Question 1: Color -->
      <label for="color-select">What is your favourite colour?</label>
      <select id="color-select" name="favorite-color" required>
        <option value="" disabled selected>Select a color...</option>
        <option value="red">Red</option>
        <option value="blue">Blue</option>
        <option value="green">Green</option>
        <option value="yellow">Yellow</option>
        <option value="purple">Purple</option>
        <option value="orange">Orange</option>
        <option value="pink">Pink</option>
        <option value="black">Black</option>
        <option value="white">White</option>
      </select>

      <!-- Question 2: Decade -->
      <label for="decade-select">What's your favourite decade?</label>
      <select id="decade-select" name="favorite-decade" required>
        <option value="" disabled selected>Select a decade...</option>
        <option value="60s">60s</option>
        <option value="70s">70s</option>
        <option value="80s">80s</option>
        <option value="90s">90s</option>
      </select>

      <!-- Question 3: World King Decree -->
      <label for="decree-select">If you were "World King", what would be your first decree?</label>
      <select id="decree-select" name="world-decree" required>
        <option value="" disabled selected>Select a decree...</option>
        <option value="invade-greenland">Invade Greenland</option>
        <option value="legalize-drugs">Legalize All Drugs</option>
        <option value="intelligent-reproduce">Only Let Medically 'Intelligent' People Reproduce</option>
        <option value="abolish-monarchy">Abdicate and Abolish the Monarchy</option>
        <option value="illuminati-steel-pan">Take Down the Illuminati with a Steel Pan</option>
        <option value="simply-exist">Nothing. Simply Exist</option>
      </select>

      <button type="submit" id="submit-btn">Submit</button>
      <button type="button" id="reset-btn">Start Again</button>
    </form>

    <div id="image-container">
      <p id="status-text"></p>
      <img id="kermit-img" src="" alt="Custom Colored Kermit">
      <p id="bio-text"></p>
    </div>
  </div>

 <script>
  const form = document.getElementById('color-form');
  const colorSelect = document.getElementById('color-select');
  const decadeSelect = document.getElementById('decade-select');
  const decreeSelect = document.getElementById('decree-select');
  const submitBtn = document.getElementById('submit-btn');
  const resetBtn = document.getElementById('reset-btn');
  const kermitImg = document.getElementById('kermit-img');
  const statusText = document.getElementById('status-text');
  const bioText = document.getElementById('bio-text');

  function getDecadeFeature(decade) {
    switch (decade) {
      case '60s': return 'wearing a hippy headband';
      case '70s': return 'with a big 1970s rock and roll hairstyle';
      case '80s': return 'with an 80s mullet haircut';
      case '90s': return 'with a baseball cap and jacket';
      default: return '';
    }
  }

  form.addEventListener('submit', async function(event) {
    event.preventDefault();

    const selectedColor = colorSelect.value;
    const selectedDecade = decadeSelect.value;
    const selectedDecreeText = decreeSelect.options[decreeSelect.selectedIndex].text;
    
    if (!selectedColor || !selectedDecade || !decreeSelect.value) return;

    const decadeFeature = getDecadeFeature(selectedDecade);

    // Disable controls & reset view
    submitBtn.disabled = true;
    colorSelect.disabled = true;
    decadeSelect.disabled = true;
    decreeSelect.disabled = true;
    statusText.textContent = 'Hold onto your panty...';
    statusText.style.display = 'block';
    statusText.style.color = '#555';
    kermitImg.style.display = 'none';
    bioText.style.display = 'none';

    // Build IMAGE prompt
    const promptText = `Generate an image of Kermit the Frog with ${selectedColor} color skin, ${decadeFeature}`;
    const prompt = encodeURIComponent(promptText);
    const seed = Math.floor(Math.random() * 100000);

    // Load Image
    kermitImg.src = '';
    kermitImg.src = `https://image.pollinations.ai/prompt/${prompt}?seed=${seed}&model=turbo&nologo=true`;

    kermitImg.onload = async function() {
      kermitImg.style.display = 'block';
      statusText.textContent = 'Generating surreal creator lore...';

      // Dynamic text prompt using all 3 inputs + a random seed for unique stories
      const aiPromptText = `Write a deeply surreal, weird, short story (under 35 words) about a ${selectedColor}-skinned Kermit the Frog from the ${selectedDecade} who became World King and decreed to: "${selectedDecreeText}".`;
      const encodedTextPrompt = encodeURIComponent(aiPromptText);
      const textSeed = Math.floor(Math.random() * 999999);

      try {
        // Direct, reliable, free text generation via Pollinations GET API
        const textResponse = await fetch(`https://text.pollinations.ai/${encodedTextPrompt}?seed=${textSeed}&model=mistral`);
        
        if (!textResponse.ok) throw new Error("Text API failed");
        
        const story = await textResponse.text();

        statusText.style.display = 'none';
        bioText.textContent = story.trim();
        bioText.style.display = 'block';

      } catch (err) {
        // Fallback generator with randomized template variations
        statusText.style.display = 'none';
        const actions = ["dissolved into glittering tea", "warped local gravity", "summoned a council of felt elders", "broadcast banjo frequency waves worldwide"];
        const randomAction = actions[Math.floor(Math.random() * actions.length)];
        
        bioText.textContent = `In a haze of ${selectedColor} light, World King Kermit of the ${selectedDecade} decreed to ${selectedDecreeText.toLowerCase()}. As the decree passed, reality fractured and he ${randomAction}.`;
        bioText.style.display = 'block';
      }

      resetBtn.style.display = 'block';
      submitBtn.disabled = false;
    };

    kermitImg.onerror = function() {
      statusText.textContent = 'Failed to generate image. Please try again.';
      statusText.style.color = 'red';
      submitBtn.disabled = false;
      colorSelect.disabled = false;
      decadeSelect.disabled = false;
      decreeSelect.disabled = false;
      resetBtn.style.display = 'block';
    };
  });

  resetBtn.addEventListener('click', function() {
    form.reset();
    kermitImg.src = '';
    kermitImg.style.display = 'none';
    bioText.style.display = 'none';
    statusText.style.display = 'none';
    resetBtn.style.display = 'none';
    submitBtn.disabled = false;
    colorSelect.disabled = false;
    decadeSelect.disabled = false;
    decreeSelect.disabled = false;
  });
</script>

</body>
</html>
