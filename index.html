<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>He's Back!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
      padding: 1rem;
    }
    .container {
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    label {
      font-size: 1.1rem;
      font-weight: bold;
      display: block;
      margin-bottom: 0.5rem;
      text-align: left;
    }
    select {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
      margin-bottom: 1.2rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 0.5rem;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #reset-btn {
      background-color: #6c757d;
      display: none;
    }
    #reset-btn:hover {
      background-color: #5a6268;
    }
    #image-container {
      margin-top: 1.5rem;
    }
    #kermit-img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      display: none;
      margin-top: 1rem;
    }
    #status-text {
      display: none;
      font-weight: bold;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="container">
    <form id="color-form">
      <!-- Question 1: Color -->
      <label for="color-select">What is your favourite colour?</label>
      <select id="color-select" name="favorite-color" required>
        <option value="" disabled selected>Select a color...</option>
        <option value="red">Red</option>
        <option value="blue">Blue</option>
        <option value="green">Green</option>
        <option value="yellow">Yellow</option>
        <option value="purple">Purple</option>
        <option value="orange">Orange</option>
        <option value="pink">Pink</option>
        <option value="black">Black</option>
        <option value="white">White</option>
      </select>

      <!-- Question 2: Decade -->
      <label for="decade-select">What's your favourite decade?</label>
      <select id="decade-select" name="favorite-decade" required>
        <option value="" disabled selected>Select a decade...</option>
        <option value="60s">60s</option>
        <option value="70s">70s</option>
        <option value="80s">80s</option>
        <option value="90s">90s</option>
      </select>

      <button type="submit" id="submit-btn">Submit</button>
      <button type="button" id="reset-btn">Start Again</button>
    </form>

    <div id="image-container">
      <p id="status-text"></p>
      <img id="kermit-img" src="" alt="Custom Colored Kermit">
    </div>
  </div>

  <script>
    const form = document.getElementById('color-form');
    const colorSelect = document.getElementById('color-select');
    const decadeSelect = document.getElementById('decade-select');
    const submitBtn = document.getElementById('submit-btn');
    const resetBtn = document.getElementById('reset-btn');
    const kermitImg = document.getElementById('kermit-img');
    const statusText = document.getElementById('status-text');

    // Function to map the decade to the corresponding accessory/style
    function getDecadeFeature(decade) {
      switch (decade) {
        case '60s':
          return 'wearing a hippy headband';
        case '70s':
          return 'with a big 1970s rock and roll hairstyle';
        case '80s':
          return 'with an 80s mullet haircut';
        case '90s':
          return 'with red spiky hair and a goatee beard, but it is still undoubtedly Kermit!';
        default:
          return '';
      }
    }

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      const selectedColor = colorSelect.value;
      const selectedDecade = decadeSelect.value;
      
      if (!selectedColor || !selectedDecade) return;

      // Get the specific decade feature string
      const decadeFeature = getDecadeFeature(selectedDecade);

      // Disable inputs and update UI state
      submitBtn.disabled = true;
      colorSelect.disabled = true;
      decadeSelect.disabled = true;
      statusText.textContent = 'Hold onto your panty...';
      statusText.style.display = 'block';
      statusText.style.color = '#555';
      kermitImg.style.display = 'none';

      // Build the prompt dynamically
      const promptText = `Generate an image of Kermit the Frog with ${selectedColor} color skin, ${decadeFeature}`;
      const prompt = encodeURIComponent(promptText);
      const seed = Math.floor(Math.random() * 100000);
      
      // Request using turbo model for speed
      kermitImg.src = '';
      kermitImg.src = `https://image.pollinations.ai/prompt/${prompt}?seed=${seed}&model=turbo&nologo=true`;

      kermitImg.onload = function() {
        statusText.style.display = 'none';
        kermitImg.style.display = 'block';
        resetBtn.style.display = 'block';
        submitBtn.disabled = false;
      };

      kermitImg.onerror = function() {
        statusText.textContent = 'Failed to generate image. Please try again.';
        statusText.style.color = 'red';
        submitBtn.disabled = false;
        colorSelect.disabled = false;
        decadeSelect.disabled = false;
        resetBtn.style.display = 'block';
      };
    });

    // Reset button logic
    resetBtn.addEventListener('click', function() {
      form.reset();
      kermitImg.src = '';
      kermitImg.style.display = 'none';
      statusText.style.display = 'none';
      resetBtn.style.display = 'none';
      submitBtn.disabled = false;
      colorSelect.disabled = false;
      decadeSelect.disabled = false;
    });
  </script>

</body>
</html>
