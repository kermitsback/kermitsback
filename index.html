<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>He's Back!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
      padding: 1rem;
    }
    .container {
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    label {
      font-size: 1.2rem;
      font-weight: bold;
      display: block;
      margin-bottom: 1rem;
    }
    select {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
      margin-bottom: 1.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 0.5rem;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #reset-btn {
      background-color: #6c757d;
      display: none;
    }
    #reset-btn:hover {
      background-color: #5a6268;
    }
    #image-container {
      margin-top: 1.5rem;
    }
    #kermit-img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      display: none;
      margin-top: 1rem;
    }
    #status-text {
      display: none;
      font-weight: bold;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="container">
    <form id="color-form">
      <label for="color-select">What is your favourite colour?</label>
      
      <select id="color-select" name="favorite-color" required>
        <option value="" disabled selected>Select a color...</option>
        <option value="red">Red</option>
        <option value="blue">Blue</option>
        <option value="green">Green</option>
        <option value="yellow">Yellow</option>
        <option value="purple">Purple</option>
        <option value="orange">Orange</option>
        <option value="pink">Pink</option>
        <option value="black">Black</option>
        <option value="white">White</option>
      </select>

      <button type="submit" id="submit-btn">Submit</button>
      <button type="button" id="reset-btn">Start Again</button>
    </form>

    <div id="image-container">
      <p id="status-text"></p>
      <img id="kermit-img" src="" alt="Custom Colored Kermit">
    </div>
  </div>

  <script>
    const form = document.getElementById('color-form');
    const colorSelect = document.getElementById('color-select');
    const submitBtn = document.getElementById('submit-btn');
    const resetBtn = document.getElementById('reset-btn');
    const kermitImg = document.getElementById('kermit-img');
    const statusText = document.getElementById('status-text');

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      const selectedColor = colorSelect.value;
      if (!selectedColor) return;

      // Disable inputs and update UI state
      submitBtn.disabled = true;
      colorSelect.disabled = true;
      statusText.textContent = 'Hold onto your panty...';
      statusText.style.display = 'block';
      statusText.style.color = '#555';
      kermitImg.style.display = 'none';

      // Build API request
      const prompt = encodeURIComponent(`Generate an image of Kermit the Frog with ${selectedColor} color skin`);
      const seed = Math.floor(Math.random() * 100000);
      
      // Clear previous src to trigger a clean load event
      kermitImg.src = '';
      kermitImg.src = `https://image.pollinations.ai/prompt/${prompt}?seed=${seed}&nologo=true`;

      kermitImg.onload = function() {
        statusText.style.display = 'none';
        kermitImg.style.display = 'block';
        resetBtn.style.display = 'block'; // Show reset button once loaded
        submitBtn.disabled = false;
      };

      kermitImg.onerror = function() {
        statusText.textContent = 'Failed to generate image. Please try again.';
        statusText.style.color = 'red';
        submitBtn.disabled = false;
        colorSelect.disabled = false;
        resetBtn.style.display = 'block';
      };
    });

    // Reset button logic
    resetBtn.addEventListener('click', function() {
      form.reset();
      kermitImg.src = '';
      kermitImg.style.display = 'none';
      statusText.style.display = 'none';
      resetBtn.style.display = 'none';
      submitBtn.disabled = false;
      colorSelect.disabled = false;
    });
  </script>

</body>
</html>
